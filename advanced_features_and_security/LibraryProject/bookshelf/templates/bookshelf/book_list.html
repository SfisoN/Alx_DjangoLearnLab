
{% extends "base.html" %}
{% block content %}
<h1>Books</h1>

<form method="get" action="">
  {% csrf_token %}  <!-- CSRF token in all forms -->
  {{ form.q }}
  <button type="submit">Search</button>
</form>

<ul>
  {% for book in books %}
    <li>
      <!-- Template auto-escapes variables to prevent XSS -->
      <a href="{% url 'bookshelf:book_detail' book.pk %}">{{ book.title }}</a> — {{ book.author }}
    </li>
  {% empty %}
    <li>No books found.</li>
  {% endfor %}
</ul>

{% if perms.bookshelf.can_create %}
  <a href="{% url 'bookshelf:book_create' %}">Create a new book</a>
{% endif %}
{% endblock %}
