{% extends "base.html" %}
{% block content %}
  <h1>Confirm delete</h1>
  <p>Are you sure you want to delete "{{ book }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'bookshelf:book_list' %}">No, go back</a>
  </form>
{% endblock %}
